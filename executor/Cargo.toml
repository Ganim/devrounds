[workspace]
members = ["bins/devrounds-executor", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Ganim/devrounds"
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON output follows struct field order.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tempfile = "3"
windows-sys = { version = "0.61", default-features = false }
zstd = { version = "0.13", default-features = false }
# TLS is rustls with ring (aws-lc-rs needs cmake and NASM on every build machine); roots come from Windows: the
# platform verifier for pairing over HTTPS, the system store for the WebSocket.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
