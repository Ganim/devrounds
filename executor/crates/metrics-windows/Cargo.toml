[package]
name = "devrounds-metrics-windows"
description = "Windows process collector and pressure source for devrounds-metrics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The crate is empty on other platforms, so its dependencies are Windows-only too.
[target.'cfg(windows)'.dependencies]
async-trait.workspace = true
devrounds-core = { path = "../core" }
devrounds-metrics = { path = "../metrics" }
devrounds-sys-windows = { path = "../sys-windows" }
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
devrounds-runner-windows = { path = "../runner-windows" }
devrounds-test-fixtures = { path = "../test-fixtures" }
tempfile.workspace = true
