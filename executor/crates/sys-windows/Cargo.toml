[package]
name = "devrounds-sys-windows"
description = "Safe wrappers over the Win32 calls the DevRounds executor uses on Windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The crate is empty on other platforms, so its dependencies are Windows-only too.
[target.'cfg(windows)'.dependencies]
thiserror.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    # `WNDCLASSW` names a GDI brush.
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # `ReadProcessMemory`/`WriteProcessMemory` for `CreationFlags::accept_ctrl_c`.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    # `PROCESS_BASIC_INFORMATION` names the kernel's PEB.
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true
