[package]
name = "devrounds-executor-bin"
description = "The devrounds-executor binary"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "devrounds-executor"
path = "src/main.rs"

[dependencies]
devrounds-executor = { path = "../../crates/executor" }

[target.'cfg(windows)'.dependencies]
devrounds-runner-windows = { path = "../../crates/runner-windows" }
devrounds-core = { path = "../../crates/core" }
devrounds-metrics-windows = { path = "../../crates/metrics-windows" }
devrounds-protocol = { path = "../../crates/protocol" }
devrounds-store = { path = "../../crates/store" }
devrounds-sys-windows = { path = "../../crates/sys-windows" }
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
