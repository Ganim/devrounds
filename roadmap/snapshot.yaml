      - key: P2-T09
        title: Shared package store and build cache
        blocked_by:
          - P2-T01
        criteria:
          - Every worktree on a machine shares one pnpm store and one turbo local cache (TURBO_CACHE_DIR) seeded by a warm base checkout of trunk; a new worktree's build-deps on unchanged trunk comes 170/170 from cache
          - Installs on one machine are serialized by a per-machine concurrency cap, so N new worktrees never pay the ~550 s concurrent install
