# Daily upstream devlanes check as a job (run it with --cwd <repo root>): fetches upstream, then opens one F- task
# per commit that is not yet ported or reviewed, never a second one while it is open. DEVROUNDS_URL, DEVROUNDS_TOKEN
# (an agent token) and DEVROUNDS_PROJECT are user variables on the machine; git needs HOME to find its config.
# Schedule it with
#   devrounds schedule set devlanes-sync --job-type devlanes-sync --cwd <repo> --daily 06:30
key: devlanes-sync
command:
  program: pnpm
  args: [devlanes-sync, --fetch, --open-tasks]
env:
  [
    PATH,
    PATHEXT,
    SystemRoot,
    ComSpec,
    USERPROFILE,
    APPDATA,
    LOCALAPPDATA,
    TEMP,
    TMP,
    HOME,
    DEVROUNDS_URL,
    DEVROUNDS_TOKEN,
    DEVROUNDS_PROJECT,
  ]
timeout_s: 900
# --open-tasks exits with the first failing CLI code: 4 control plane unreachable, 5 auth or permission (AGENTS.md).
# Other codes (a failed fetch, a vanished mapped path, an open that failed otherwise) stay unclassified.
classify:
  - class: infra
    exit_codes: [4]
  - class: environment
    exit_codes: [5]
