# The gate case of pnpm e2e (scripts/e2e/executor.e2e.ts): prints its environment, so the log shows the job's
# DR_E2E_MARK, and runs as long as the check's args say (--run-ms). tree-fixture is found on the PATH the executor
# runs with.
key: gate-check
command:
  program: tree-fixture
  args: [--print-env]
args_from_job: true
job_env: [DR_E2E_MARK]
env: [PATH, PATHEXT, SystemRoot]
timeout_s: 120
