# DevRounds's daily improvement report as a job (run it with --cwd <repo root>): yesterday in the tenant time zone
# against the 7 days before, one F- task per finding, never a second one while it is open. DEVROUNDS_URL,
# DEVROUNDS_TOKEN (an agent token) and DEVROUNDS_PROJECT are user variables on the machine. Schedule it with
#   devrounds schedule set improvement-report --job-type improvement-report --cwd <repo> --daily 06:00
key: improvement-report
command:
  program: node
  args: [control-plane/src/cli/main.ts, report, improvement, --open-tasks]
env:
  [
    PATH,
    PATHEXT,
    SystemRoot,
    ComSpec,
    USERPROFILE,
    APPDATA,
    LOCALAPPDATA,
    TEMP,
    TMP,
    DEVROUNDS_URL,
    DEVROUNDS_TOKEN,
    DEVROUNDS_PROJECT,
  ]
timeout_s: 300
# CLI exit codes (AGENTS.md), every one classified so a failed report never adds to the unclassified share it
# measures. A refused finding exits with the code of its error after every other finding was tried.
#   4 control plane unreachable, 6 internal: infra
#   3 project not found, 5 auth or permission: environment (the machine's DEVROUNDS_* variables)
#   1 state conflict, 2 input: check_red (the report sent something the control plane refuses: a defect to fix)
classify:
  - class: infra
    exit_codes: [4, 6]
  - class: environment
    exit_codes: [3, 5]
  - class: check_red
    exit_codes: [1, 2]
